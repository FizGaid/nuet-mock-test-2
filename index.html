    <script>
        // ==========================================
        // БАЗА ВОПРОСОВ MOCK TEST 2
        // ==========================================
const examData = {
            math: {
                title: "Mathematics (Mock 2)",
                duration: 60,
                questions: [
                    { id: "m1", text: "Convert 72 km/h to m/s.", options: [{ id: "a", text: "15" }, { id: "b", text: "20" }, { id: "c", text: "25" }, { id: "d", text: "30" }], correct: "b", explanation: "1 km = 1000 m and 1 h = 3600 s. 72 km/h = 72 * 1000 / 3600 m/s = 72 / 3.6 = 20 m/s. Shortcut: km/h ÷ 3.6 = m/s.", points: 2 },
                    { id: "m2", text: "Simplify $(3 + \\sqrt{5})(4 - \\sqrt{5})$.", options: [{ id: "a", text: "$17 + \\sqrt{5}$" }, { id: "b", text: "$12 + 7\\sqrt{5}$" }, { id: "c", text: "$7 + \\sqrt{5}$" }, { id: "d", text: "$7 - \\sqrt{5}$" }], correct: "c", explanation: "Expand all four products: $3 \\times 4 = 12$; $3 \\times (-\\sqrt{5}) = -3\\sqrt{5}$; $\\sqrt{5} \\times 4 = 4\\sqrt{5}$; $\\sqrt{5} \\times (-\\sqrt{5}) = -5$. Sum: $12 - 5 + (-3\\sqrt{5} + 4\\sqrt{5}) = 7 + \\sqrt{5}$.", points: 3 },
                    { id: "m3", text: "A rectangle has sides $(5 + \\sqrt{3})$ cm and $(5 - \\sqrt{3})$ cm. What is its area in cm²?", options: [{ id: "a", text: "22" }, { id: "b", text: "28" }, { id: "c", text: "$25 - \\sqrt{3}$" }, { id: "d", text: "20" }], correct: "a", explanation: "Area = $(5 + \\sqrt{3})(5 - \\sqrt{3})$, a difference of squares: $a^2 - b^2 = 5^2 - (\\sqrt{3})^2 = 25 - 3 = 22$ cm².", points: 3 },
                    { id: "m4", text: "Each interior angle of a regular polygon is 150°. How many sides does the polygon have?", options: [{ id: "a", text: "8" }, { id: "b", text: "10" }, { id: "c", text: "15" }, { id: "d", text: "12" }], correct: "d", explanation: "Exterior angle = $180° - 150° = 30°$. Exterior angles sum to 360°, so $n = 360/30 = 12$.", points: 3 },
                    { id: "m5", text: "Write as a single fraction: $0.4(5) + 0.(27)$", options: [{ id: "a", text: "731/990" }, { id: "b", text: "721/990" }, { id: "c", text: "721/900" }, { id: "d", text: "41/99" }], correct: "b", explanation: "First number: $0.4(5) = 41/90$. Second number: $0.(27) = 27/99 = 3/11$. Common denominator 990: $41/90 = 451/990$ and $3/11 = 270/990$. Sum = $(451 + 270)/990 = 721/990$.", points: 4 },
                    { id: "m6", text: "One city has $8.2 \\times 10^6$ inhabitants and another has $5.7 \\times 10^5$. How many more people live in the larger city? Give the answer in standard form.", options: [{ id: "a", text: "$7.63 \\times 10^5$" }, { id: "b", text: "$2.5 \\times 10^6$" }, { id: "c", text: "$7.63 \\times 10^6$" }, { id: "d", text: "$7.63 \\times 10^7$" }], correct: "c", explanation: "Bring both to the same power of 10: $5.7 \\times 10^5 = 0.57 \\times 10^6$. Difference = $(8.2 - 0.57) \\times 10^6 = 7.63 \\times 10^6$.", points: 4 },
                    { id: "m7", text: "Find the LCM of 84 and 126.", options: [{ id: "a", text: "126" }, { id: "b", text: "504" }, { id: "c", text: "168" }, { id: "d", text: "252" }], correct: "d", explanation: "Prime factorisation: $84 = 2^2 \\times 3 \\times 7$; $126 = 2 \\times 3^2 \\times 7$. LCM takes the highest power of each prime: $2^2 \\times 3^2 \\times 7 = 4 \\times 9 \\times 7 = 252$.", points: 4 },
                    { id: "m8", text: "$\\nabla x$ is defined as the smallest odd number greater than the positive square root of $x$. What is the value of $\\nabla 50$?", options: [{ id: "a", text: "7" }, { id: "b", text: "9" }, { id: "c", text: "11" }, { id: "d", text: "8" }], correct: "b", explanation: "$49 < 50 < 64$, so $7 < \\sqrt{50} < 8$. Odd numbers greater than 7.07: 9, 11, 13... The smallest is 9.", points: 5 },
                    { id: "m9", text: "An 80-litre mixture is 30% juice. How many litres of pure juice must be added to make a 50% juice mixture?", options: [{ id: "a", text: "32" }, { id: "b", text: "16" }, { id: "c", text: "40" }, { id: "d", text: "48" }], correct: "a", explanation: "Juice now: $0.3 \\times 80 = 24$ L. Add x litres of pure juice: $(24 + x)/(80 + x) = 0.5 \\rightarrow 24 + x = 40 + 0.5x \\rightarrow 0.5x = 16 \\rightarrow x = 32$.", points: 4 },
                    { id: "m10", text: "Two similar bottles have heights 12 cm and 18 cm. The smaller bottle holds 400 ml. What is the capacity of the larger bottle, in ml?", options: [{ id: "a", text: "600" }, { id: "b", text: "900" }, { id: "c", text: "1800" }, { id: "d", text: "1350" }], correct: "d", explanation: "Length scale factor = $18/12 = 3/2$. Volume scale factor = $(3/2)^3 = 27/8$. Larger volume = $400 \\times 27/8 = 1350$ ml.", points: 5 },
                    { id: "m11", text: "Written in the form $a(x + p)^2 + q$, the expression $2x^2 + 12x + 7$ has $q$ equal to", options: [{ id: "a", text: "-7" }, { id: "b", text: "7" }, { id: "c", text: "-11" }, { id: "d", text: "-18" }], correct: "c", explanation: "Factor 2 from x-terms: $2(x^2 + 6x) + 7$. Complete the square: $x^2 + 6x = (x + 3)^2 - 9$. $2[(x + 3)^2 - 9] + 7 = 2(x + 3)^2 - 18 + 7 = 2(x + 3)^2 - 11$. So $q = -11$.", points: 5 },
                    { id: "m12", text: "A cone fits exactly inside a cylinder, with the same base and the same height. What fraction of the cylinder's volume does the cone take up?", options: [{ id: "a", text: "1/3" }, { id: "b", text: "1/4" }, { id: "c", text: "1/2" }, { id: "d", text: "2/3" }], correct: "a", explanation: "Cylinder: $V = \\pi r^2h$. Cone: $V = \\frac{1}{3}\\pi r^2h$. Ratio = 1/3.", points: 2 },
                    { id: "m13", text: "Find the complete set of values of x for which $x^3 - 7x^2 + 12x > 0$.", options: [{ id: "a", text: "0 < x < 4" }, { id: "b", text: "0 < x < 3, x > 4" }, { id: "c", text: "x < 0, 3 < x < 4" }, { id: "d", text: "x < 0, x > 4" }], correct: "b", explanation: "Factor: $x(x^2 - 7x + 12) = x(x - 3)(x - 4)$. Critical points: 0, 3, 4. Testing intervals shows it is positive when $0 < x < 3$ or $x > 4$.", points: 5 },
                    { id: "m14", text: "If $f(x) = 1 + 1/x$, then $f(x/(x + 2)) =$", options: [{ id: "a", text: "$(x + 2)/x$" }, { id: "b", text: "$(2x + 2)/(x + 2)$" }, { id: "c", text: "$(x + 1)/x$" }, { id: "d", text: "$(2x + 2)/x$" }], correct: "d", explanation: "Replace x by $x/(x + 2)$: $f = 1 + 1 / [x/(x + 2)] = 1 + (x + 2)/x = (x + x + 2)/x = (2x + 2)/x$.", points: 4 },
                    { id: "m15", text: "A straight line passes through (0, 3) and (6, 0). Which of the following points lies on the line?", options: [{ id: "a", text: "(8, 1)" }, { id: "b", text: "(2, 3)" }, { id: "c", text: "(4, 1)" }, { id: "d", text: "(10, -3)" }], correct: "c", explanation: "Gradient = $(0 - 3)/(6 - 0) = -1/2$; y-intercept = 3. Equation: $y = -x/2 + 3$, or $x + 2y = 6$. Testing options: $4 + 2(1) = 6$.", points: 3 },
                    { id: "m16", text: "A particle's speed increases uniformly from 0 to 20 km/h during the first 2 hours, stays at 20 km/h for the next 3 hours, then decreases uniformly to 0 over the final 3 hours. What total distance does it travel, in km?", options: [{ id: "a", text: "110" }, { id: "b", text: "100" }, { id: "c", text: "140" }, { id: "d", text: "220" }], correct: "a", explanation: "Distance = area under speed-time graph. Triangle 1: $0.5 \\times 2 \\times 20 = 20$. Rectangle: $3 \\times 20 = 60$. Triangle 2: $0.5 \\times 3 \\times 20 = 30$. Total = 110 km.", points: 4 },
                    { id: "m17", text: "The diagonals of a rhombus PQRS are PR = 3x cm and QS = (14 − 2x) cm. The area of the rhombus is 30 cm². What is the difference, in cm, between the two possible lengths of PR?", options: [{ id: "a", text: "6" }, { id: "b", text: "9" }, { id: "c", text: "15" }, { id: "d", text: "4.5" }], correct: "b", explanation: "Area = $0.5 \\times d_1 \\times d_2 = 0.5(3x)(14-2x) = 30 \\rightarrow x(14-2x) = 20 \\rightarrow 14x - 2x^2 = 20 \\rightarrow x^2 - 7x + 10 = 0$. Roots are 2 and 5. PR = 6 or 15. Difference = 9.", points: 5 },
                    { id: "m18", text: "Maria bought 25 items, notebooks and pens, and spent $41. A notebook costs $2 and a pen costs $1.25. How many notebooks did she buy?", options: [{ id: "a", text: "12" }, { id: "b", text: "10" }, { id: "c", text: "15" }, { id: "d", text: "13" }], correct: "d", explanation: "Let n = notebooks, p = pens. $n + p = 25 \\rightarrow p = 25 - n$. Cost: $2n + 1.25(25 - n) = 41 \\rightarrow 2n + 31.25 - 1.25n = 41 \\rightarrow 0.75n = 9.75 \\rightarrow n = 13$.", points: 4 },
                    { id: "m19", text: "Make x the subject of $y = x^2 - 8x + 3$ (take the positive root).", options: [{ id: "a", text: "$x = 4 + \\sqrt{y - 13}$" }, { id: "b", text: "$x = 4 + \\sqrt{y + 3}$" }, { id: "c", text: "$x = 4 + \\sqrt{y + 13}$" }, { id: "d", text: "$x = -4 + \\sqrt{y + 13}$" }], correct: "c", explanation: "Complete the square: $x^2 - 8x = (x - 4)^2 - 16$. $y = (x - 4)^2 - 16 + 3 = (x - 4)^2 - 13$. $y + 13 = (x - 4)^2 \\rightarrow x = 4 + \\sqrt{y + 13}$.", points: 5 },
                    { id: "m20", text: "Find the area of a sector whose arc length is 14 cm and whose radius is 5 cm, in cm².", options: [{ id: "a", text: "35" }, { id: "b", text: "70" }, { id: "c", text: "140" }, { id: "d", text: "25\\pi" }], correct: "a", explanation: "Area of sector = $1/2 \\times r \\times \\text{arc length}$. $A = 1/2 \\times 5 \\times 14 = 35$ cm².", points: 3 },
                    { id: "m21", text: "RU and SV are diameters of a circle with centre T and radius 6. Angle UTV = 120°. What is the length of the chord RS?", options: [{ id: "a", text: "6" }, { id: "b", text: "6\\sqrt{3}" }, { id: "c", text: "6\\sqrt{2}" }, { id: "d", text: "12" }], correct: "b", explanation: "Angle RTS = 120° (vertically opposite). Triangle RTS is isosceles with sides 6 and 6. Cosine rule: $RS^2 = 6^2 + 6^2 - 2(6)(6)\\cos(120°) = 72 + 36 = 108$. $RS = \\sqrt{108} = 6\\sqrt{3}$.", points: 4 },
                    { id: "m22", text: "A square of side 8 cm has a quarter circle of radius 8 cm drawn inside it, centred at one vertex of the square. What is the area inside the square but outside the quarter circle, in cm²?", options: [{ id: "a", text: "$64 - 8\\pi$" }, { id: "b", text: "$64 - 32\\pi$" }, { id: "c", text: "$16(2 - \\pi)$" }, { id: "d", text: "$16(4 - \\pi)$" }], correct: "d", explanation: "Square area = 64. Quarter circle area = $1/4 \\times \\pi \\times 8^2 = 16\\pi$. Required area = $64 - 16\\pi = 16(4 - \\pi)$.", points: 3 },
                    { id: "m23", text: "A sector of a circle has radius 12 cm and angle $\\pi/3$. What is its perimeter in cm?", options: [{ id: "a", text: "$24 + 8\\pi$" }, { id: "b", text: "$12 + 4\\pi$" }, { id: "c", text: "$24 + 4\\pi$" }, { id: "d", text: "$24 + 2\\pi$" }], correct: "c", explanation: "Arc length = $r\\theta = 12 \\times \\pi/3 = 4\\pi$. Perimeter = arc + two straight radii = $4\\pi + 12 + 12 = 24 + 4\\pi$.", points: 3 },
                    { id: "m24", text: "In an arithmetic progression the sum of the 2nd and 4th terms is 22 and the sum of the 3rd and 7th terms is 38. Find the 10th term.", options: [{ id: "a", text: "39" }, { id: "b", text: "43" }, { id: "c", text: "35" }, { id: "d", text: "41" }], correct: "a", explanation: "Eq1: $(a+d) + (a+3d) = 2a+4d=22 \\rightarrow a+2d=11$. Eq2: $(a+2d) + (a+6d) = 2a+8d=38 \\rightarrow a+4d=19$. Subtracting gives $2d=8 \\rightarrow d=4$, and $a=3$. 10th term = $a+9d = 3+36=39$.", points: 5 },
                    { id: "m25", text: "A regular square pyramid has a slant height of 15 cm and a lateral edge of 17 cm. What is its total surface area, in cm²?", options: [{ id: "a", text: "496" }, { id: "b", text: "736" }, { id: "c", text: "480" }, { id: "d", text: "976" }], correct: "b", explanation: "Half-side of base = $\\sqrt{17^2 - 15^2} = \\sqrt{64} = 8$. Side = 16. Base area = 256. Lateral area = $4 \\times (1/2 \\times 16 \\times 15) = 480$. Total = $256 + 480 = 736$.", points: 5 },
                    { id: "m26", text: "Find x if $9^{x-1} \\times 27^x = 81^2$.", options: [{ id: "a", text: "1" }, { id: "b", text: "3" }, { id: "c", text: "4" }, { id: "d", text: "2" }], correct: "d", explanation: "$3^{2x-2} \\times 3^{3x} = 3^8 \\rightarrow 3^{5x-2} = 3^8 \\rightarrow 5x - 2 = 8 \\rightarrow 5x = 10 \\rightarrow x = 2$.", points: 4 },
                    { id: "m27", text: "OABC is a trapezium with AB parallel to OC. OA = 3a, AB = 2b and OC = 6b. E is the midpoint of AC. Write the vector AE in terms of a and b.", options: [{ id: "a", text: "$-3a + 6b$" }, { id: "b", text: "$3a - 6b$" }, { id: "c", text: "$-(3/2)a + 3b$" }, { id: "d", text: "$-(3/2)a - 3b$" }], correct: "c", explanation: "AC = AO + OC = -3a + 6b. E is the midpoint, so AE = $1/2 \\text{AC} = -1.5a + 3b = -(3/2)a + 3b$.", points: 5 },
                    { id: "m28", text: "In triangle PQR, S lies on PR and QS is perpendicular to PR. PS = p cm, PQ = q cm and angle QRS = 38°. Which expression gives the length SR in cm?", options: [{ id: "a", text: "$\\sqrt{q^2 - p^2} / \\tan 38^{\\circ}$" }, { id: "b", text: "$\\sqrt{q^2 - p^2} \\times \\tan 38^{\\circ}$" }, { id: "c", text: "$\\sqrt{q^2 - p^2} / \\sin 38^{\\circ}$" }, { id: "d", text: "$\\sqrt{q^2 - p^2} \\times \\cos 38^{\\circ}$" }], correct: "a", explanation: "In right triangle PSQ, $QS = \\sqrt{q^2 - p^2}$. In right triangle QSR, $\\tan 38^{\\circ} = QS/SR \\rightarrow SR = QS / \\tan 38^{\\circ}$.", points: 4 },
                    { id: "m29", text: "The curve y = sin x is stretched by scale factor 1/3 parallel to the x-axis and then translated by $\\pi/6$ in the positive x-direction. What is the equation of the new curve?", options: [{ id: "a", text: "$y = \\sin(3x - \\pi/6)$" }, { id: "b", text: "$y = \\sin(3x - \\pi/2)$" }, { id: "c", text: "$y = \\sin(3x + \\pi/2)$" }, { id: "d", text: "$y = \\sin(3x + \\pi/6)$" }], correct: "b", explanation: "Stretch by 1/3 parallel to x: $x \\rightarrow 3x$. Translation by $\\pi/6$: $x \\rightarrow (x - \\pi/6)$. Equation: $y = \\sin(3(x - \\pi/6)) = \\sin(3x - \\pi/2)$.", points: 4 },
                    { id: "m30", text: "Find the sum of the solutions of $(x + 2)^2 - (x + 2) - 12 = 0$.", options: [{ id: "a", text: "-7" }, { id: "b", text: "7" }, { id: "c", text: "3" }, { id: "d", text: "-3" }], correct: "d", explanation: "Substitute $u = x + 2$: $u^2 - u - 12 = 0 \\rightarrow (u - 4)(u + 3) = 0 \\rightarrow u = 4$ or $u = -3$. Since $x = u - 2$, $x = 2$ or $x = -5$. Sum = $2 - 5 = -3$.", points: 5 }
                ]
            },
            ct: {
                title: "Critical Thinking & Problem Solving (Mock 2)",
                duration: 60,
                questions: [
                    { id: "ct1", text: "Throughout history, gold has been revered and used for expensive jewellery and ornamentation. But in the future, it will be prized for its practical uses rather than for its aesthetic appeal. It wasn't until early in the last century that gold's electrical conductivity properties were discovered. Solid state electronic devices use very low voltages and currents, which are easily interrupted by corrosion at the contact points. Gold is such an efficient conductor that it can carry these tiny currents and remain free of corrosion, making the devices highly reliable. A small amount of gold is used in almost every modern electronic device, and it is predicted that within ten years, more gold will be used in the production of electronics than in jewellery.\n\nWhich one of the following best expresses the main conclusion of the above argument?", options: [{ id: "A", text: "In the future gold will be prized for its practical uses rather than for its aesthetic appeal." }, { id: "B", text: "It wasn't until early in the last century that gold's electrical conductivity properties were discovered." }, { id: "C", text: "Gold is such an efficient conductor that it can carry tiny electrical currents and remain free of corrosion." }, { id: "D", text: "A small amount of gold is used in almost every modern electronic device." }, { id: "E", text: "Within ten years, more gold will be used in the production of electronics than in jewellery." }], correct: "A", explanation: "The correct answer is A[cite: 7, 43]. The first sentence introduces the topic, and the second sentence provides the main conclusion that gold's practical uses will outweigh its aesthetic appeal in the future. The rest of the passage provides the reasoning and evidence for this claim.", points: 1 },
                    { id: "ct3", text: "Whether known as the high street, main street, or market square, central shopping districts in many towns throughout the world are in danger of disappearing. The decline in some downtown shopping areas began decades ago because of various social and economic trends, including an increase in the number of women working outside of the home and the development of large supermarkets and retail parks further out on the outskirts of towns. While change is inevitably difficult, communities should not be fearful about the loss of their traditional shopping areas. Shopping is increasingly conducted via the internet. Compared to traditional ways of shopping, the online model offers savings in terms of time and other resources while also providing greater consumer choice.\n\nWhich one of the following is an underlying assumption of the above argument?", options: [{ id: "A", text: "Women in many countries do less shopping than in previous decades." }, { id: "B", text: "The decline in central shopping districts is happening more quickly in places with wealthier populations." }, { id: "C", text: "It is difficult for governments to try to stop the decline of central shopping areas." }, { id: "D", text: "The growth in online shopping will not threaten the profitability of large supermarkets on the outskirts of towns." }, { id: "E", text: "Traditional shopping areas serve no important purpose that cannot be satisfied by alternative shopping methods." }], correct: "E", explanation: "The correct answer is E[cite: 8, 43]. The argument assumes that because alternative shopping methods (like the internet) are more efficient, there is nothing else of value lost when traditional shopping areas disappear (like community connection or social spaces).", points: 1 },
                    { id: "ct4", text: "I have always said that owners of expensive cars are less considerate drivers, and now a study has proved me right. The study showed that they are less likely to stop at a pedestrian crossing to allow someone to cross the road than drivers of less expensive cars - in fact, their likelihood to do so decreased by about 3% for every £800 increase in the vehicle's value. Previous studies have also shown that wealth is associated with greater self-regard and lower levels of fellow feeling. So next time an expensive sports car comes along while you are waiting at a pedestrian crossing, you can be sure that it won't stop.\n\nWhich one of the following best illustrates the flaw in the above argument?", options: [{ id: "A", text: "It ignores the possibility that the drivers are wealthy because they are selfish, rather than vice versa." }, { id: "B", text: "It assumes that owners of expensive cars are unlikely ever to be pedestrians themselves." }, { id: "C", text: "It fails to take account of the greater safety features available in more expensive cars." }, { id: "D", text: "It assumes that just because drivers of expensive cars are less likely to stop, none of them will." }, { id: "E", text: "It ignores the fact that pedestrians can take undue risks when trying to cross the road." }], correct: "D", explanation: "The correct answer is D[cite: 8, 43]. The flaw is over-generalizing from a statistical probability (decreased likelihood) to an absolute certainty ('you can be sure that it won't stop').", points: 1 },
                    { id: "ct5", text: "You only win an election if you gain a majority of votes. You must have gained a majority of votes because you were named the winner in the election.\n\nWhich one of the following most closely parallels the reasoning used in the above argument?", options: [{ id: "A", text: "You are only promoted to be head teacher if you have taught for many years. You have taught for many years, so you are sure to be promoted to be head teacher." }, { id: "B", text: "You can only go to the concert if you buy tickets or win them in the competition. You must have bought your tickets as someone else won the competition." }, { id: "C", text: "You only get a high-paying job if you study hard in school. You are certain to get a high-paying job because you studied hard in school." }, { id: "D", text: "You can only apply for a loan from the bank or the credit union. You missed the bank's deadline for submitting forms, so you will have to apply to the credit union." }, { id: "E", text: "You are only eligible for the scholarship if you can prove financial need. You have been declared eligible for the scholarship so you must have proved financial need." }], correct: "E", explanation: "The correct answer is E[cite: 9, 43]. The structure is: X is a necessary condition for Y. Y has occurred, therefore X must have occurred. E perfectly matches this logical structure.", points: 1 },
                    { id: "ct9", text: "Bicycle owners have a duty to have their bicycles maintained properly. This is to ensure the safety both of the rider and of other road users. If an injury is caused to another person as a result of a failure to maintain a bicycle properly, then the injured person should be entitled to compensation from the owner of the bicycle.\n\nWhich one of the following best illustrates the principle used in the above argument?", options: [{ id: "A", text: "Skiers injured whilst skiing off the official ski run should be entitled to compensation from the manufacturer of the skis." }, { id: "B", text: "A passenger on a train who is injured tripping over luggage not put in the luggage rack should be entitled to compensation from the train company." }, { id: "C", text: "A child injured while playing on a broken swing in a park should be entitled to compensation from the park owner." }, { id: "D", text: "A householder scalded when pouring water from a kettle should be entitled to compensation from the manufacturer of the kettle." }, { id: "E", text: "People who eat too many biscuits and damage their health should be entitled to compensation from the shops which sold the biscuits." }], correct: "C", explanation: "The correct answer is C[cite: 12, 43]. The underlying principle is that the owner of property is responsible for maintaining it safely, and must compensate those injured due to a failure in that maintenance.", points: 1 },
                    { id: "ct10", text: "Despite ranking top of gender equality lists, Sweden is like practically every other country in terms of having an unequal division of labour for unpaid housework. Perpetuating stereotypes about who should be responsible for cleaning tasks, women still perform more domestic chores than their male partners. To address this enduring sexism about 'women's work', Sweden has recently implemented a tax policy through which the government pays half of the bill when households employ a cleaner. This policy has been a success: couples that hired a cleaner because of the subsidy report fewer arguments over housework, and the female partners have been able to devote a significant number of additional hours per month to their own paid employment.\n\nWhich one of the following, if true, most weakens the above argument?", options: [{ id: "A", text: "Swedish women do fewer hours of housework a week on average than women in many other countries." }, { id: "B", text: "Many women enjoy doing housework." }, { id: "C", text: "Sweden has a long-standing policy of paid paternity leave for fathers of newborn children." }, { id: "D", text: "Most of the cleaners hired because of the subsidy are women." }, { id: "E", text: "The Swedish educational system has a long tradition of emphasising gender-neutral teaching methods." }], correct: "D", explanation: "The correct answer is D[cite: 12, 43]. If the newly hired cleaners are mostly women, the policy hasn't actually solved the core issue of sexism about 'women's work' - it merely outsourced it to other women, weakening the claim of success.", points: 1 },
                    { id: "ct11", text: "People are attracted to cities because of the job opportunities that they bring. At the same time, house prices tend to push people away from urban centres. The draw of healthy living and green environments similarly pulls people towards less urban environments, further from city centres. The limiting factor in suburban spread - the expansion of cities beyond their existing boundaries - is often travel time, by either public or private means. One of the appeals of driverless cars is that they are set to cut delays by up to 40 per cent because they switch lanes more efficiently, drive closer to the vehicle in front, and travel at a constant speed without repeatedly braking and accelerating, which is the main cause of congestion.\n\nWhich one of the following can be drawn as a conclusion from the above passage?", options: [{ id: "A", text: "We can expect some cities to expand beyond their current limits as a result of driverless cars." }, { id: "B", text: "There will no longer be any limits to suburban spread with the introduction of driverless cars." }, { id: "C", text: "The attractions of living in city centres will disappear once people have access to a driverless car." }, { id: "D", text: "The introduction of driverless cars could mean that there are no longer any green spaces for people to enjoy." }, { id: "E", text: "There will be more people living in suburban environments than city centres after the introduction of driverless cars." }], correct: "A", explanation: "The correct answer is A[cite: 13, 43]. The passage states that travel time limits suburban spread, and driverless cars will cut these travel delays. Therefore, it's logical to conclude that cities will expand further.", points: 1 },
                    { id: "ct15", text: "There is no denying the unwanted consequences of car emissions, burning of fossil fuels, chemical effluent, and other pollutants. Their negative effects include the increasing incidence of respiratory, skin, and heart conditions. But 'environments' consist of more than just the elements of air, earth, and water. Whilst it is quite right to headline the damage we are doing to our lungs and other bodily organs, it must not be thought that this is the only way in which we are polluting our world. The effects of artificial light and constant noise are also detrimental to mental and physical wellbeing...\n\nWhich one of the following best expresses the main conclusion of the above argument?", options: [{ id: "A", text: "The word 'environment' does not apply only to the elements of air, earth, and water." }, { id: "B", text: "It is right to give prominent coverage to the damage human activity is doing to our bodies." }, { id: "C", text: "It is wrong to think that pollution of the air, earth and water is the only form of environmental damage." }, { id: "D", text: "The effects of artificial light and noise are physically and mentally harmful." }, { id: "E", text: "Many people are deprived of the sight of the stars or the experience of natural silence." }], correct: "C", explanation: "The correct answer is C[cite: 15, 43]. The passage asserts that we focus heavily on air/earth/water pollution, but strongly argues that we must recognize noise and light as valid, harmful pollutants too.", points: 1 },
                    { id: "ct16", text: "The past couple of decades have been fairly tricky for many countries due to economic challenges and political and social uncertainties. The UK has certainly been amongst such countries. But life there is getting better, according to the World Happiness Report... The project measures the quality of life in over 150 countries by scoring such factors as life expectancy, social support infrastructure, personal freedoms, and absence of corruption. In the latest Report, the UK had risen in the rankings from 15th to 13th place. While still a number of places beneath Finland, once again rated the happiest country, the UK has definitely become happier.\n\nWhich one of the following is an underlying assumption of the above argument?", options: [{ id: "A", text: "The UK has made changes in direct response to the findings of the World Happiness Report in previous years." }, { id: "B", text: "It is rare for a country to move up two places in the rankings in a period of one year." }, { id: "C", text: "The World Happiness Report is designed to show that happiness is not largely dependent on economic factors." }, { id: "D", text: "The UK's movement in the rankings was not solely due to a fall in happiness in other countries." }, { id: "E", text: "The levels of happiness experienced in Finland are possible to achieve in most other countries." }], correct: "D", explanation: "The correct answer is D[cite: 16, 43]. The argument assumes that moving up in a relative ranking system actually means the UK improved objectively, rather than other countries simply getting worse.", points: 1 },
                    { id: "ct17", text: "People complain about the fact that newspapers are often full of recycled articles about celebrity gossip, but they forget that real news costs money - investigative reporters need to go out into the world and unearth new information. The trouble is, those who complain are also unprepared to pay to read newspapers, expecting to get information for free online. But what can people expect if they want to be able to read the news for free? As they say, you get what you pay for. If you want something for free, then don't complain about the quality. This is as true of the news as of anything else.\n\nWhich one of the following best illustrates the principle used in the above argument?", options: [{ id: "A", text: "A person who is offered a free printer as a bonus when buying a new computer cannot complain if the computer is expensive." }, { id: "B", text: "A person who gives as gifts items obtained for free cannot complain if friends and family criticise them for being selfish." }, { id: "C", text: "A person who finds a winning lottery ticket cannot complain if the owner of the ticket tries to claim the winnings." }, { id: "D", text: "A person who obtains free legal advice online cannot complain if the advice ends up being unhelpful." }, { id: "E", text: "A person who buys an illegally copied film cannot complain if the picture is not as clear as they would like it to be." }], correct: "D", explanation: "The correct answer is D[cite: 16, 43]. The principle is explicitly stated: 'If you want something for free, then don't complain about the quality.' Option D perfectly mirrors this.", points: 1 },
                    { id: "ct21", text: "Some people have such good natural stamina that they can run a marathon with no training. John was able to run a marathon on Saturday. It is possible he did no training in preparation.\n\nWhich one of the following most closely parallels the reasoning used in the above argument?", options: [{ id: "A", text: "Some experts believe that putting bath salts in the bath increases the likelihood of someone getting eczema. Charlie has eczema. It is likely he puts bath salts in his bath." }, { id: "B", text: "Most superheroes have super powers which help them fight villains. Batman doesn't have any super powers. Therefore he is not a superhero." }, { id: "C", text: "Frogs do not survive in ponds with duck weed. Mustafa has a pond in his garden with frogs living in it. It is possible that Mustafa's pond has frogs and no duck weed." }, { id: "D", text: "It is possible to get lung cancer without ever being a smoker. Jill has got lung cancer. Therefore, she may not be a smoker." }, { id: "E", text: "Some trees can be killed by hammering iron nails into them. Oswald's tree died. Therefore, he must have hammered an iron nail into it." }], correct: "D", explanation: "The correct answer is D[cite: 19, 43]. The structure states that X can happen without Y. X happened to John. Therefore, it's possible John didn't do Y. D matches this: Lung cancer can happen without smoking. Jill got lung cancer. She may not be a smoker.", points: 1 },
                    { id: "ct22", text: "In a recent UK news broadcast, a white reporter appeared to mistake a Labour Member of Parliament (MP), who is Black, for another MP who is also Black. This shows the dangers of a lack of diversity in workplaces... A recent report showed that only 14.8% of that television channel's workforce were from a minority ethnic or racial background. Media organisations in the UK should take this as a wake-up call, and take steps to ensure that the diversity of their workforce mirrors that of the wider population.\n\nWhich one of the following is an underlying assumption of the argument above?", options: [{ id: "A", text: "A reporter of the same racial background as the MPs would not have made this type of mistake." }, { id: "B", text: "Mistakes like the ones identified in the passage are common in the media." }, { id: "C", text: "Media organisations have a moral duty to ensure they have a diverse workforce." }, { id: "D", text: "Having a more diverse workforce enables mistakes like these to be avoided." }, { id: "E", text: "Similar types of errors do not take place in any other workplace." }], correct: "D", explanation: "The correct answer is D[cite: 19, 43]. The author suggests hiring a diverse workforce as a direct solution ('wake-up call') to stop these mistaken identity errors, assuming that diversity will actually prevent them.", points: 1 },
                    { id: "ct23", text: "Recent figures issued by the UK Department of Education have revealed that the proportion of students with special educational needs and disabilities (SEND) who have reached the expected level of educational achievement by the time they leave secondary school is lower than that of the population as a whole. The Government cannot evade responsibility for this disappointing statistic. By not providing the funds required by schools who have students with these needs, the Government has failed to ensure the right of such students to equality of opportunity.\n\nWhich one of the following, if true, most weakens the above argument?", options: [{ id: "A", text: "Some students with SEND have problems with reading and writing but have good ability to understand and reason." }, { id: "B", text: "Some students with SEND require a quiet environment to help them to concentrate on what they are doing." }, { id: "C", text: "Some students with SEND require content and tasks from lessons to be explained to them in simpler language." }, { id: "D", text: "Some students with SEND have physical problems which require the provision of a wheelchair or other aids." }, { id: "E", text: "Some students with SEND have conditions which limit their ability to understand and to reason." }], correct: "E", explanation: "The correct answer is E[cite: 20, 43]. If some SEND students face inherent cognitive limits, they might naturally score lower regardless of government funding or school resources, weakening the blame on the government.", points: 1 },
                    { id: "ct27", text: "Trains in the UK are operated by private companies approved by the government and awarded a franchise for which they must meet certain standards... SuperRail, which operates the trains in one part of the country, has a poor record to date and has been warned that if it again exceeds the annual limits set by the government for late departures or arrivals, it will receive a heavy fine and will lose its franchise. At the end of the third quarter, however, SuperRail's performance was within the defined limits. So if the operator can maintain their performance in the final quarter, they will keep the franchise for another year.\n\nWhich one of the following best illustrates the flaw in the above argument?", options: [{ id: "A", text: "It draws a conclusion about what will happen from something that may or may not happen." }, { id: "B", text: "It assumes that there are no other reasons why a rail franchise might be lost." }, { id: "C", text: "It denies the possibility that the company may exceed the limits and still keep the franchise." }, { id: "D", text: "It predicts what will happen in the future on the basis of what has happened to date." }, { id: "E", text: "It concludes that the franchise will be kept but not that the fine will be avoided." }], correct: "B", explanation: "The correct answer is B[cite: 23, 43]. The argument assumes that keeping delays low is the *only* condition for keeping the franchise, ignoring other potential rule breaches that could cause them to lose it.", points: 1 },
                    { id: "ct28", text: "If you arrive late for work, you will definitely get fired. You lost your last job so you must have arrived late for work.\n\nWhich one of the following most closely parallels the reasoning used in the above argument?", options: [{ id: "A", text: "If you turn up the volume, the music gets louder. The music is very loud now which means that you turned up the volume." }, { id: "B", text: "If a company wants to be successful, it needs to insist on the punctuality of its employees. This company does not take the punctuality of its employees seriously, so it will not be successful." }, { id: "C", text: "Disciplinary action is initiated against all workers who do not wear a helmet on the building site. No disciplinary action has been initiated against Mike, so he must have always worn a helmet on the site." }, { id: "D", text: "You need a membership card to use the services of the gym. You do not have a membership card, so you cannot use the gym." }, { id: "E", text: "In order to anger a hippo, it is enough to drive close to it with a boat. They are driving close to this one, thus it will become angry." }], correct: "A", explanation: "The correct answer is A[cite: 23, 43]. The passage makes the logical fallacy of 'Affirming the Consequent' (If A then B. B happened. Therefore A). Option A perfectly mimics this: If Volume(A) then Louder(B). Louder(B). Therefore Volume(A).", points: 1 },

                    { id: "ps2", text: "A quiz consists of 7 rounds, each of which contains 20 questions. Each question is worth one point. At the end of the quiz, each team is allowed to select one round and the score for that round is tripled. In addition, the scores for the rounds immediately before and after the chosen round are doubled. The winning team scored: Round 1 (14), R2 (16), R3 (6), R4 (20), R5 (10), R6 (18), R7 (4). Their final score was 136. Which round did they choose to have tripled?", options: [{ id: "A", text: "round 2" }, { id: "B", text: "round 3" }, { id: "C", text: "round 4" }, { id: "D", text: "round 5" }, { id: "E", text: "round 6" }], correct: "B", explanation: "The correct answer is B[cite: 7, 43]. Base score without multipliers = 88. We need 136 - 88 = 48 extra points. If Round 3 is selected: Extra = 2*(6) + 16(before) + 20(after) = 12 + 36 = 48.", points: 1 },
                    { id: "ps6", text: "Rob has two mixtures of apple and orange juice. Mixture 1 is 40% apple / 60% orange. Mixture 2 is 70% apple / 30% orange. Rob wants to use these to make 6 litres of a mixture which is 50% apple and 50% orange. How much of mixture 2 does Rob need to use?", options: [{ id: "A", text: "1 litre" }, { id: "B", text: "2 litres" }, { id: "C", text: "3 litres" }, { id: "D", text: "4 litres" }, { id: "E", text: "5 litres" }], correct: "B", explanation: "The correct answer is B[cite: 9, 43]. Let y be the amount of Mix 2. Apple juice equation: 0.4(6 - y) + 0.7y = 0.5(6). -> 2.4 - 0.4y + 0.7y = 3 -> 0.3y = 0.6 -> y = 2 litres.", points: 1 },
                    { id: "ps12", text: "The shampoo that I normally buy costs £1.96 for a 500 ml bottle and always lasts for 40 days. Last month I decided to try a new brand that is 36p cheaper and contains 550 ml. However, because of the amount that I have had to use to wash my hair properly, it has run out after only 25 days. By how many pence per day is my normal shampoo better value than the new brand?", options: [{ id: "A", text: "1.5" }, { id: "B", text: "2.4" }, { id: "C", text: "4.9" }, { id: "D", text: "6.4" }, { id: "E", text: "9.5" }], correct: "A", explanation: "The correct answer is A[cite: 13, 43]. Normal shampoo cost per day = 196p / 40 days = 4.9p per day. New brand cost per day = 160p / 25 days = 6.4p per day. Difference = 6.4p - 4.9p = 1.5p per day.", points: 1 },
                    { id: "ps13", text: "Kate and Tek are choosing a cottage to rent. Facilities:\nAcorns (3 beds, No garden, Wifi, No parking, Pets, 2km to store, $460)\nBeeches (3 beds, Garden, Wifi, No parking, Pets, 1km, $490)\nChestnuts (4 beds, No garden, Wifi, Parking, No pets, 2km, $510)\nDenders (4 beds, Garden, Wifi, Parking, No pets, 4km, $500)\nEglers (2 beds, No garden, Wifi, Parking, No pets, 2km, $450)\n\nThey insist on AT LEAST 3 beds, and AT LEAST 3 of the other 4 wishes (garden, wifi, parking, <3km to store). If multiple match, they take the cheapest. Which will they choose?", options: [{ id: "A", text: "Acorns" }, { id: "B", text: "Beeches" }, { id: "C", text: "Chestnuts" }, { id: "D", text: "Denders" }, { id: "E", text: "Eglers" }], correct: "B", explanation: "The correct answer is B[cite: 14, 43]. Eglers is eliminated (only 2 beds). Denders is eliminated (fails garden/wifi/parking/<3km count - wait, Denders has garden, wifi, parking, but fails distance. It satisfies 3 wishes. Chestnuts satisfies wifi, parking, <3km = 3 wishes. Beeches satisfies garden, wifi, <3km = 3 wishes. Acorns satisfies wifi, <3km = 2 wishes. Cheapest among Denders($500), Chestnuts($510), and Beeches($490) is Beeches.", points: 1 },
                    { id: "ps14", text: "Alex and Anita play a game forming words from letters. The value of each letter is a whole number of points. MOAN = 7 points. MOON = 8 points. NOON = 10 points. Anita just formed the word ANNA. What is the value of the word ANNA?", options: [{ id: "A", text: "4" }, { id: "B", text: "6" }, { id: "C", text: "8" }, { id: "D", text: "10" }, { id: "E", text: "12" }], correct: "C", explanation: "The correct answer is C[cite: 15, 43]. NOON (2N + 2O) = 10 -> N+O = 5. MOON - MOAN = O - A = 1 -> O = A+1. NOON - MOON = N - M = 2. Solving these gives A=1, M=1, O=2, N=3. ANNA = 2A + 2N = 2(1) + 2(3) = 8.", points: 1 },
                    { id: "ps18", text: "Sean is taking his car to Sunny Island. He lives 38 miles away from the mainland terminal. The ferry ticket (car and passenger) is $80. Alternatively, a plane ticket is $50 and the seaport company will transport his car for $100. Fuel costs are $1.50 per mile. How much money will Sean save by taking the cheaper option?", options: [{ id: "A", text: "$13" }, { id: "B", text: "$20" }, { id: "C", text: "$30" }, { id: "D", text: "$70" }, { id: "E", text: "$127" }], correct: "D", explanation: "The correct answer is D[cite: 17, 43]. Both options require driving 38 miles to the port, so fuel cost is identical and cancels out. Option 1: Ferry = $80. Option 2: Plane ($50) + Car Transport ($100) = $150. Savings = 150 - 80 = $70.", points: 1 },
                    { id: "ps24", text: "Iman and Maya ran a 100 metre race. Iman started 2 seconds after Maya and finished 3 seconds before her. If each girl ran at a constant speed throughout the race, and Iman's speed was 25% faster than Maya's, for how many seconds did Iman run?", options: [{ id: "A", text: "15 seconds" }, { id: "B", text: "18 seconds" }, { id: "C", text: "20 seconds" }, { id: "D", text: "22 seconds" }, { id: "E", text: "25 seconds" }], correct: "C", explanation: "The correct answer is C[cite: 20, 43]. Let T be the time Iman ran. Maya ran for T + 5 seconds. Iman's speed is 100/T. Maya's speed is 100/(T+5). Iman is 25% faster: 100/T = 1.25 * (100/(T+5)). Solving gives T = 20.", points: 1 },
                    { id: "ps30", text: "In a prize draw, tickets are printed with 3-digit numbers from 001 to 999. A major prize is awarded for all tickets where the product of the 3 digits is 8. What is the maximum number of major prizes which could be won?", options: [{ id: "A", text: "7" }, { id: "B", text: "9" }, { id: "C", text: "10" }, { id: "D", text: "13" }, { id: "E", text: "14" }], correct: "C", explanation: "The correct answer is C[cite: 24, 43]. We need 3 digits that multiply to 8: (1, 1, 8), (1, 2, 4), and (2, 2, 2). Arrangements of 1,1,8 = 3. Arrangements of 1,2,4 = 6. Arrangements of 2,2,2 = 1. Total = 3 + 6 + 1 = 10.", points: 1 },
                    { id: "ps31", text: "The table shows the cost of hot drinks: Tea £1.50, Coffee £2.50, Chocolate £3.00. Belle bought a number of hot drinks, including at least one of each. She was charged £32.00. If she bought the same number of teas as coffees, what was the maximum number of hot drinks that Belle could have bought?", options: [{ id: "A", text: "9" }, { id: "B", text: "10" }, { id: "C", text: "12" }, { id: "D", text: "13" }, { id: "E", text: "14" }], correct: "E", explanation: "The correct answer is E[cite: 25, 43]. Let x be the number of teas (and coffees). Let y be chocolates. Cost: 1.5x + 2.5x + 3y = 32 -> 4x + 3y = 32. If x=5, 20 + 3y = 32 -> y = 4. Total drinks = 5+5+4 = 14.", points: 1 },
                    { id: "ps32", text: "I have a wooden cube with edges that are 5 cm long. I paint it: one pair of opposite faces is red, one pair green, one pair blue. Now I cut the cube into small 1 cm cubes. How many of the small cubes have one green face, one blue face, but no red face?", options: [{ id: "A", text: "6" }, { id: "B", text: "8" }, { id: "C", text: "12" }, { id: "D", text: "16" }, { id: "E", text: "24" }], correct: "C", explanation: "The correct answer is C[cite: 26, 43]. Cubes with exactly two painted faces lie on the edges between faces. There are 4 edges connecting a green face to a blue face. Each 5cm edge has 3 middle cubes (excluding the corners which touch red). 4 edges * 3 cubes = 12.", points: 1 },
                    { id: "ps36", text: "Grandma spent £60 on five books for Miya, Harriet, and Mehran. She spends most on the child who reads most. Miya reads 1 hr/day (7hrs/wk). Harriet reads 1 hr/day Mon-Thu and 2 hrs/day Fri-Sun (10hrs/wk). Mehran reads 1.5 hrs/day Sat-Sun only (3hrs/wk). Books: Hungry Dinosaurs(£8), Celeb Six(£9), Fly Away(£13), Come Back(£14), Biraffe(£16).\nWhich statement is true?", options: [{ id: "A", text: "Harriet was given 'The Celebrated Six'." }, { id: "B", text: "Harriet was given 'Fly Away'." }, { id: "C", text: "Mehran was given 'The Biraffe'." }, { id: "D", text: "Miya was given 'Come Back'." }, { id: "E", text: "Miya was given 'Hungry Dinosaurs'." }], correct: "E", explanation: "The correct answer is E[cite: 29, 43]. Total hours = 20. £60/20h = £3/hr. Budgets: Mehran(£9), Miya(£21), Harriet(£30). Mehran gets Celeb Six(£9). Miya gets Hungry Dinosaurs(£8) + Fly Away(£13) = £21. Harriet gets Come Back(£14) + Biraffe(£16) = £30.", points: 1 },
                    { id: "ps37", text: "In a ball game points are accumulated by chops, creamers, glinks, and yips. A chop is worth 1 point more than a creamer, and a creamer is worth twice as many points as a glink. I lose 47 to 50, scoring 3 chops, 4 yips, 3 creamers, and 4 glinks. Opponent scored 5 chops, 3 yips, 3 creamers, and 2 glinks.\nWhich statement about the scoring system is true?", options: [{ id: "A", text: "A creamer is worth more points than a chop." }, { id: "B", text: "Two chops are worth less than three yips." }, { id: "C", text: "A glink is worth 2 points." }, { id: "D", text: "Three yips are worth more than three creamers." }, { id: "E", text: "A chop is worth 6 points." }], correct: "C", explanation: "The correct answer is C[cite: 29, 43]. Let G=glink. Creamer C=2G. Chop H=2G+1. My score: 3H + 4Y + 3C + 4G = 47. Opponent: 5H + 3Y + 3C + 2G = 50. Substituting and solving the system reveals G=2 points.", points: 1 },
                    { id: "ps42", text: "In my currency, there are six types of coin: 200p, 100p, 50p, 20p, 10p, 5p. I start with two coins. I purchase two bars of chocolate and pay using the two coins. My change consists of two coins. The next day I purchase another one bar with that change. My new change, again, consists of two coins. The six coins I possess across these two days are all different. I only have two coins at any time. Chocolate price doesn't change.\nWhat is the price of a bar of chocolate?", options: [{ id: "A", text: "15p" }, { id: "B", text: "25p" }, { id: "C", text: "30p" }, { id: "D", text: "55p" }, { id: "E", text: "60p" }], correct: "D", explanation: "The correct answer is D[cite: 32, 43]. If a bar is 55p, two bars cost 110p. Pay with 200p + 10p = 210p. Change is 100p. (Wait, needs two coins. 100p + 0? No). By testing, 55p works uniquely: Start with 200p + 20p = 220p. 2 bars = 110p. Change = 100p + 10p = 110p. Day 2: 1 bar = 55p. Pay 110p, change = 50p + 5p = 55p. Coins used: 200, 20, 100, 10, 50, 5. All 6 distinct.", points: 1 },
                    { id: "ps46", text: "On Sports Day at St Jude's College points are awarded: 1st(10), 2nd(6), 3rd(3), 4th(1). Each student may enter a maximum of three events. What is the lowest score that is not possible for a student to achieve?", options: [{ id: "A", text: "15" }, { id: "B", text: "22" }, { id: "C", text: "24" }, { id: "D", text: "27" }, { id: "E", text: "31" }], correct: "C", explanation: "The correct answer is C[cite: 35, 43]. Possible combinations of up to 3 scores: 15 (6+6+3). 22 (10+6+6). 27 (10+10+7... wait, no. 10+10+6=26. 9+9+9?). By checking systematically, you cannot form 24 using a maximum of three numbers from the set {0, 1, 3, 6, 10}.", points: 1 },
                    { id: "ps48", text: "My three friends bought food at the supermarket. They did not remember the prices, only the total.\nHector paid $3.50 for 3 bread rolls and 1 apple.\nLee paid $8.00 for 1 apple and 4 chocolate bars.\nOlga paid $3.50 for 1 bread roll and 2 chocolate bars.\nI want to buy 1 bread roll, 1 apple and 1 chocolate bar. How much do I need to pay?", options: [{ id: "A", text: "$3.00" }, { id: "B", text: "$3.50" }, { id: "C", text: "$4.00" }, { id: "D", text: "$4.50" }, { id: "E", text: "$5.00" }], correct: "C", explanation: "The correct answer is C[cite: 36, 43]. 3B + 1A = 3.5. 1A + 4C = 8. 1B + 2C = 3.5. Solving gives B = $0.50, A = $2.00, C = $1.50. Total for one of each = 0.5 + 2 + 1.5 = $4.00.", points: 1 }
                ]
            }
        };

            }
        }

        function renderHome() {
            app.innerHTML = `
                <div class="max-w-4xl mx-auto p-8 w-full">
                    <h1 class="text-4xl font-bold text-navy mb-2">NUET MOCK TEST 2</h1>
                    <p class="text-cobalt text-xl mb-10">Practice. Improve. Succeed.</p>
                    
                    <div class="grid md:grid-cols-2 gap-8">
                        <div class="bg-white p-6 rounded-2xl shadow-lg border-t-4 border-navy flex flex-col">
                            <h2 class="text-2xl font-bold text-navy mb-4">Mathematics</h2>
                            <p class="text-gray-600 mb-6 flex-grow">Evaluate your problem-solving skills. No calculators allowed.</p>
                            <button onclick="startExam('math')" class="bg-navy text-white py-3 rounded-lg hover:bg-cobalt transition font-bold">Start Math Test</button>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-lg border-t-4 border-cobalt flex flex-col">
                            <h2 class="text-2xl font-bold text-cobalt mb-4">Critical Thinking</h2>
                            <p class="text-gray-600 mb-6 flex-grow">Analyze arguments, find flaws, and identify assumptions.</p>
                            <button onclick="startExam('ct')" class="bg-cobalt text-white py-3 rounded-lg hover:bg-navy transition font-bold">Start CT Test</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function startExam(subject) {
            state.subject = subject;
            state.view = 'exam';
            state.currentIndex = 0;
            state.answers = {};
            state.timeLeft = examData[subject].duration * 60;
            
            clearInterval(state.timerId);
            state.timerId = setInterval(() => {
                state.timeLeft--;
                if (state.timeLeft <= 0) {
                    submitExam();
                } else {
                    document.getElementById('timer-display').innerText = formatTime(state.timeLeft);
                }
            }, 1000);

            renderExam();
        }

        function selectAnswer(qId, aId) {
            state.answers[qId] = aId;
            renderExam();
        }

        function renderExam() {
            const data = examData[state.subject];
            const q = data.questions[state.currentIndex];
            const answeredCount = Object.keys(state.answers).length;

            let optionsHtml = q.options.map(opt => {
                const isSelected = state.answers[q.id] === opt.id || state.answers[q.id] === opt.id.toLowerCase() || state.answers[q.id] === opt.id.toUpperCase();
                return `
                    <button onclick="selectAnswer('${q.id}', '${opt.id}')" 
                        class="w-full text-left p-4 rounded-lg border-2 transition ${isSelected ? 'border-cobalt bg-blue-50' : 'border-gray-200 hover:border-gray-300'}">
                        <span class="font-bold mr-3 uppercase">${opt.id}.</span> ${opt.text}
                    </button>
                `;
            }).join('');

            let navHtml = data.questions.map((_, idx) => {
                const hasAnswer = state.answers[data.questions[idx].id];
                const isCurrent = idx === state.currentIndex;
                return `
                    <button onclick="state.currentIndex = ${idx}; renderExam();" 
                        class="p-2 rounded font-semibold text-sm ${isCurrent ? 'ring-2 ring-cobalt' : ''} ${hasAnswer ? 'bg-cobalt text-white' : 'bg-gray-100 text-gray-600'}">
                        ${idx + 1}
                    </button>
                `;
            }).join('');

            app.innerHTML = `
                <div class="bg-navy text-white p-4 flex justify-between items-center shadow-md">
                    <div class="font-bold text-lg">${data.title} Exam</div>
                    <div class="flex items-center gap-4">
                        <div id="timer-display" class="font-mono text-xl">${formatTime(state.timeLeft)}</div>
                        <button onclick="if(confirm('Submit your test?')) submitExam();" class="bg-white text-navy px-4 py-1 rounded-md font-bold hover:bg-gray-200">Submit</button>
                    </div>
                </div>

                <div class="flex-grow max-w-5xl mx-auto w-full p-4 flex flex-col md:flex-row gap-6 mt-6">
                    <div class="md:w-3/4 bg-white p-8 rounded-xl shadow-sm border border-gray-100">
                        <h2 class="text-xl font-bold text-navy mb-4">Question ${state.currentIndex + 1} of ${data.questions.length}</h2>
                        <div class="text-lg mb-8 whitespace-pre-wrap">${q.text}</div>
                        <div class="space-y-3">${optionsHtml}</div>
                        
                        <div class="flex justify-between mt-10">
                            <button onclick="if(state.currentIndex > 0) { state.currentIndex--; renderExam(); }" class="font-bold text-cobalt ${state.currentIndex === 0 ? 'opacity-50 cursor-not-allowed' : ''}">Previous</button>
                            <button onclick="if(state.currentIndex < ${data.questions.length - 1}) { state.currentIndex++; renderExam(); }" class="font-bold text-cobalt ${state.currentIndex === data.questions.length - 1 ? 'opacity-50 cursor-not-allowed' : ''}">Next</button>
                        </div>
                    </div>

                    <div class="md:w-1/4 bg-white p-4 rounded-xl shadow-sm border border-gray-100 h-fit">
                        <h3 class="font-bold text-navy mb-3">Progress: ${answeredCount}/${data.questions.length}</h3>
                        <div class="grid grid-cols-5 gap-2">${navHtml}</div>
                    </div>
                </div>
            `;
            setTimeout(renderMath, 0);
        }

        function submitExam() {
            clearInterval(state.timerId);
            state.view = 'results';
            renderResults();
        }

        function renderResults() {
            const data = examData[state.subject];
            let score = 0;
            let totalPoints = 0;

            let reviewHtml = data.questions.map((q, idx) => {
                totalPoints += q.points;
                const normalizedAnswer = state.answers[q.id] ? state.answers[q.id].toLowerCase() : null;
                const normalizedCorrect = q.correct.toLowerCase();
                
                const isCorrect = normalizedAnswer === normalizedCorrect;
                if (isCorrect) score += q.points;

                const myAnswer = q.options.find(o => o.id.toLowerCase() === normalizedAnswer);
                const correctOption = q.options.find(o => o.id.toLowerCase() === normalizedCorrect);

                return `
                    <div class="p-6 rounded-xl border-l-4 mb-6 ${isCorrect ? 'border-green-500 bg-green-50' : 'border-red-500 bg-red-50'}">
                        <h4 class="font-bold text-lg mb-4">Question ${idx + 1} ${isCorrect ? '✅' : '❌'}</h4>
                        <div class="mb-4 whitespace-pre-wrap">${q.text}</div>
                        <div class="mb-2"><strong>Your answer:</strong> ${myAnswer ? myAnswer.text : '<i>Not answered</i>'}</div>
                        ${!isCorrect ? `<div class="mb-4 text-green-700"><strong>Correct answer:</strong> ${correctOption.text}</div>` : ''}
                        <div class="mt-4 p-4 bg-white rounded-lg border border-gray-200">
                            <p class="font-bold text-sm text-cobalt mb-1">EXPLANATION:</p>
                            <p class="text-sm whitespace-pre-wrap">${q.explanation}</p>
                        </div>
                    </div>
                `;
            }).join('');

            const percentage = Math.round((score / totalPoints) * 100);

            app.innerHTML = `
                <div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-lg mt-8 mb-8 border-t-8 border-navy">
                    <h1 class="text-3xl font-bold text-navy mb-6">Test Results: ${data.title}</h1>
                    <div class="flex items-center gap-8 mb-10 p-6 bg-blue-50 rounded-xl">
                        <div class="text-6xl font-bold text-cobalt">${percentage}%</div>
                        <div>
                            <p class="text-lg">Points: <strong>${score} / ${totalPoints}</strong></p>
                            <p class="text-lg">Answered: <strong>${Object.keys(state.answers).length} / ${data.questions.length}</strong></p>
                        </div>
                    </div>
                    <h3 class="text-2xl font-bold text-navy mb-6">Detailed Review</h3>
                    <div>${reviewHtml}</div>
                    <button onclick="state.view = 'home'; renderHome();" class="mt-8 bg-navy text-white px-6 py-3 rounded-lg font-bold hover:bg-cobalt">Back to Home</button>
                </div>
            `;
            setTimeout(renderMath, 0);
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        renderHome();
    </script>
</body>
</html>
